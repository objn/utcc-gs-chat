{% extends "base.html" %}

{% block title %}Register — GS Chat{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">GS</div>
            <h1>UTCC GS Chat</h1>
            <div class="logo-sub">Graduate School — บัณฑิตวิทยาลัย</div>
            <p>Create your administrator account</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="post">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-input" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="admin@gs.utcc.ac.th" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-input" placeholder="••••••••" minlength="8" required>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>

            {% if has_users %}
            <div class="form-divider">Already have an account?</div>
            <a href="/" class="btn-secondary">Sign in</a>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
